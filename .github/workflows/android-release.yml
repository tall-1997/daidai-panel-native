name: Android Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - '.github/workflows/android-release.yml'
      - 'app/**'
      - 'panel/server/**'
      - 'panel/web/**'
      - 'runtime/**'
      - 'contracts/**'
      - 'scripts/**'
      - 'VERSION.json'
      - 'CHANGELOG.md'
  workflow_dispatch:
    inputs:
      release_channel:
        description: Build channel
        required: true
        default: snapshot
        type: choice
        options:
          - snapshot
          - prerelease

permissions:
  contents: read
  actions: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  FLUTTER_VERSION: 3.41.5
  GO_VERSION: 1.25.0
  NODE_VERSION: '20.19.x'
  NPM_VERSION: '10.8.2'

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      evidence_name: ${{ steps.version.outputs.evidence_name }}
      version: ${{ steps.version.outputs.version }}
      release_tag: ${{ steps.version.outputs.release_tag }}
      release_channel: ${{ steps.version.outputs.release_channel }}
      candidate_artifact_name: ${{ steps.version.outputs.candidate_artifact_name }}
      kotlin_reports_artifact_name: ${{ steps.version.outputs.kotlin_reports_artifact_name }}
      stable_device_evidence_artifact_name: ${{ steps.version.outputs.stable_device_evidence_artifact_name }}
      app_apk_name: ${{ steps.version.outputs.app_apk_name }}
      test_apk_name: ${{ steps.version.outputs.test_apk_name }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: panel/server/go.sum

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: panel/web/package-lock.json

      - name: Enforce Node package manager contract
        run: |
          npm install -g "npm@${NPM_VERSION}"
          node --version | grep -Eq '^v20\.19\.'
          test "$(npm --version)" = "${NPM_VERSION}"

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve and validate release version
        id: version
        env:
          REQUESTED_CHANNEL: ${{ inputs.release_channel }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        shell: bash
        run: |
          python3 scripts/version.py check
          eval "$(python3 scripts/version.py show --format shell)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            printf 'Tag %s must equal v%s from VERSION.json\n' "${GITHUB_REF_NAME}" "${VERSION}" >&2
            exit 1
          fi
          CHANNEL=snapshot
          STRICT=false
          SIGNING_REQUIRED=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            CHANNEL=stable
            STRICT=true
            SIGNING_REQUIRED=true
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            case "${REQUESTED_CHANNEL:-snapshot}" in
              snapshot)
                ;;
              prerelease)
                CHANNEL=prerelease
                SIGNING_REQUIRED=true
                ;;
              *)
                printf 'Unsupported release channel: %s\n' "${REQUESTED_CHANNEL}" >&2
                exit 1
                ;;
            esac
          fi
          ARTIFACT_NAME="daidai-panel-native-${VERSION}-${CHANNEL}-arm64"
          RELEASE_TAG="v${VERSION}"
          CANDIDATE_ARTIFACT_NAME="android-release-candidate-${VERSION}-${GITHUB_RUN_ID}-${RUN_ATTEMPT}"
          KOTLIN_REPORTS_ARTIFACT_NAME="kotlin-test-reports-${GITHUB_RUN_ID}-${RUN_ATTEMPT}"
          STABLE_DEVICE_EVIDENCE_ARTIFACT_NAME="stable-device-evidence-${GITHUB_RUN_ID}-${RUN_ATTEMPT}"
          APP_APK_NAME="${ARTIFACT_NAME}.apk"
          TEST_APK_NAME="${ARTIFACT_NAME}-androidTest.apk"
          EVIDENCE_NAME="release-evidence-${VERSION}-${CHANNEL}"
          {
            printf 'VERSION=%s\n' "${VERSION}"
            printf 'ANDROID_VERSION_CODE=%s\n' "${ANDROID_VERSION_CODE}"
            printf 'FLUTTER_BUILD_NAME=%s\n' "${FLUTTER_BUILD_NAME}"
            printf 'FLUTTER_BUILD_NUMBER=%s\n' "${FLUTTER_BUILD_NUMBER}"
            printf 'RELEASE_CHANNEL=%s\n' "${CHANNEL}"
            printf 'STRICT_RUNTIME=%s\n' "${STRICT}"
            printf 'RELEASE_SIGNING_REQUIRED=%s\n' "${SIGNING_REQUIRED}"
            printf 'RELEASE_TAG=%s\n' "${RELEASE_TAG}"
            printf 'ARTIFACT_NAME=%s\n' "${ARTIFACT_NAME}"
            printf 'EVIDENCE_NAME=%s\n' "${EVIDENCE_NAME}"
            printf 'CANDIDATE_ARTIFACT_NAME=%s\n' "${CANDIDATE_ARTIFACT_NAME}"
            printf 'KOTLIN_REPORTS_ARTIFACT_NAME=%s\n' "${KOTLIN_REPORTS_ARTIFACT_NAME}"
            printf 'STABLE_DEVICE_EVIDENCE_ARTIFACT_NAME=%s\n' "${STABLE_DEVICE_EVIDENCE_ARTIFACT_NAME}"
            printf 'APP_APK_NAME=%s\n' "${APP_APK_NAME}"
            printf 'TEST_APK_NAME=%s\n' "${TEST_APK_NAME}"
          } >> "${GITHUB_ENV}"
          {
            printf 'version=%s\n' "${VERSION}"
            printf 'release_tag=%s\n' "${RELEASE_TAG}"
            printf 'artifact_name=%s\n' "${ARTIFACT_NAME}"
            printf 'evidence_name=%s\n' "${EVIDENCE_NAME}"
            printf 'release_channel=%s\n' "${CHANNEL}"
            printf 'candidate_artifact_name=%s\n' "${CANDIDATE_ARTIFACT_NAME}"
            printf 'kotlin_reports_artifact_name=%s\n' "${KOTLIN_REPORTS_ARTIFACT_NAME}"
            printf 'stable_device_evidence_artifact_name=%s\n' "${STABLE_DEVICE_EVIDENCE_ARTIFACT_NAME}"
            printf 'app_apk_name=%s\n' "${APP_APK_NAME}"
            printf 'test_apk_name=%s\n' "${TEST_APK_NAME}"
            printf 'strict=%s\n' "${STRICT}"
            printf 'signing_required=%s\n' "${SIGNING_REQUIRED}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate required tag release secrets
        if: steps.version.outputs.signing_required == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_CERT_SHA256: ${{ secrets.KEYSTORE_CERT_SHA256 }}
        shell: bash
        run: |
          for required in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEYSTORE_ALIAS KEYSTORE_KEY_PASSWORD KEYSTORE_CERT_SHA256; do
            if [[ -z "${!required:-}" ]]; then
              printf 'Missing required tag release secret: %s\n' "${required}" >&2
              exit 1
            fi
          done

      - name: Prepare release signing keystore
        if: steps.version.outputs.signing_required == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_CERT_SHA256: ${{ secrets.KEYSTORE_CERT_SHA256 }}
        shell: bash
        run: |
          KEYSTORE_FILE="$(mktemp "${RUNNER_TEMP}/daidai-release-keystore.XXXXXX.jks")"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_FILE}"
          keytool -list -keystore "${KEYSTORE_FILE}" -storepass "${KEYSTORE_PASSWORD}" -alias "${KEYSTORE_ALIAS}" >/dev/null
          ACTUAL_CERT_SHA256="$(keytool -exportcert \
            -keystore "${KEYSTORE_FILE}" \
            -storepass "${KEYSTORE_PASSWORD}" \
            -alias "${KEYSTORE_ALIAS}" | sha256sum | cut -d ' ' -f1)"
          EXPECTED_CERT_SHA256="$(printf '%s' "${KEYSTORE_CERT_SHA256}" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ "${ACTUAL_CERT_SHA256}" != "${EXPECTED_CERT_SHA256}" ]]; then
            printf 'Release signing certificate SHA-256 mismatch\n' >&2
            exit 1
          fi
          {
            printf 'KEYSTORE_FILE=%s\n' "${KEYSTORE_FILE}"
            printf 'KEYSTORE_PASSWORD=%s\n' "${KEYSTORE_PASSWORD}"
            printf 'KEYSTORE_ALIAS=%s\n' "${KEYSTORE_ALIAS}"
            printf 'KEYSTORE_KEY_PASSWORD=%s\n' "${KEYSTORE_KEY_PASSWORD}"
            printf 'REQUIRE_RELEASE_SIGNING=true\n'
          } >> "${GITHUB_ENV}"

      - name: Prepare Android Node runtime
        working-directory: app
        run: echo "Android Node runtime is deprecated; Node.js is installed via apk/apt in the rootfs."

      - name: Verify Android Linux runtime rootfs
        working-directory: app
        run: |
          python3 scripts/verify-android-linux-runtime.py \
            --rootfs android/app/src/main/assets/android-runtime/arm64-v8a/ubuntu/rootfs.tar.gz.bin \
            --rootfs-sha android/app/src/main/assets/android-runtime/arm64-v8a/ubuntu/rootfs.tar.gz.bin.sha256 \
            --rootfs-manifest android/app/src/main/assets/android-runtime/arm64-v8a/ubuntu/runtime-manifest.json \
            --trusted-sources scripts/rootfs-trusted-sources.json
          bash scripts/prepare-android-yaegi-runtime.sh

      - name: Test embedded Go core
        working-directory: panel/server
        run: go test ./...

      - name: Test release and runtime contract scripts
        run: |
          go test ./scripts/run-runtime-smoke.go ./scripts/run-runtime-smoke_test.go
          go test ./scripts/verify-runtime-contract.go ./scripts/verify-runtime-contract_test.go
          go test ./scripts/verify-runtime-elf.go ./scripts/verify-runtime-elf_test.go
          go test ./scripts/generate-release-evidence.go ./scripts/generate-release-evidence_test.go
          python3 -m unittest scripts/test_version.py scripts/test_android_release_workflow.py scripts/test_android_runtime_smoke.py scripts/test_verify_release_runtime_evidence.py app/scripts/test_verify_android_linux_runtime.py app/scripts/test_prepare_android_ubuntu_rootfs.py

      - name: Verify generated route contract
        run: go run ./scripts/generate-route-contract.go -check

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: app
        run: flutter test

      - name: Analyze Flutter source
        working-directory: app
        run: flutter analyze

      - name: Run Kotlin tests
        working-directory: app
        run: gradle -p android :app:testReleaseUnitTest --no-daemon --stacktrace

      - name: Upload Kotlin test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.kotlin_reports_artifact_name }}
          path: |
            app/build/app/reports/tests/testReleaseUnitTest/
            app/build/app/test-results/testReleaseUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Generate pending smoke evidence before APK build
        run: go run ./scripts/run-runtime-smoke.go --output ./runtime/smoke-evidence.json

      - name: Verify runtime contract before APK build
        shell: bash
        run: |
          go run ./scripts/verify-runtime-contract.go \
            --manifest ./runtime/manifest.json \
            --compatibility ./runtime/compatibility.json \
            --smoke-evidence ./runtime/smoke-evidence.json \
            --native-lib-dir ./app/android/app/src/main/jniLibs/arm64-v8a

      - name: Build installable release APK
        working-directory: app
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name "${FLUTTER_BUILD_NAME}" --build-number "${FLUTTER_BUILD_NUMBER}"
          gradle -p android :app:assembleReleaseAndroidTest --no-daemon --stacktrace
          cp build/app/outputs/flutter-apk/app-release.apk "../${APP_APK_NAME}"
          cp build/app/outputs/apk/androidTest/release/app-release-androidTest.apk "../${TEST_APK_NAME}"

      - name: Extract and verify APK runtime metadata
        shell: bash
        run: |
          APK_SOURCE="${APP_APK_NAME}"
          test -s "${APK_SOURCE}"
          mkdir -p release/apk-metadata
          unzip -p "${APK_SOURCE}" assets/manifest.json > release/apk-metadata/manifest.json
          unzip -p "${APK_SOURCE}" assets/compatibility.json > release/apk-metadata/compatibility.json
          unzip -p "${APK_SOURCE}" assets/smoke-evidence.json > release/apk-metadata/smoke-evidence.json
          cmp runtime/manifest.json release/apk-metadata/manifest.json
          cmp runtime/compatibility.json release/apk-metadata/compatibility.json
          cmp runtime/smoke-evidence.json release/apk-metadata/smoke-evidence.json
          go run ./scripts/verify-runtime-contract.go \
            --manifest ./runtime/manifest.json \
            --compatibility ./runtime/compatibility.json \
            --smoke-evidence ./runtime/smoke-evidence.json \
            --apk "${APK_SOURCE}"
          for APK in "${APP_APK_NAME}" "${TEST_APK_NAME}"; do
            sha256sum "${APK}" > "${APK}.sha256"
          done

      - name: Verify release APK signing certificate
        if: steps.version.outputs.signing_required == 'true'
        shell: bash
        run: |
          APKSIGNER="$(find "${ANDROID_SDK_ROOT}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "${APKSIGNER}" ]]; then
            printf 'Android SDK apksigner was not found\n' >&2
            exit 1
          fi
          for APK in "${APP_APK_NAME}" "${TEST_APK_NAME}"; do "${APKSIGNER}" verify "${APK}"; done
          APK_CERT_SHA256="$("${APKSIGNER}" verify --print-certs "${APP_APK_NAME}" \
            | sed -n 's/.*certificate SHA-256 digest: *//p' \
            | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]' \
            | grep -Eo '^[0-9a-f]{64}$' | head -n 1)"
          if [[ -z "${APK_CERT_SHA256}" ]]; then
            printf 'APK signing certificate SHA-256 could not be parsed\n' >&2
            exit 1
          fi
          EXPECTED_CERT_SHA256="$(printf '%s' '${{ secrets.KEYSTORE_CERT_SHA256 }}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ "${APK_CERT_SHA256}" != "${EXPECTED_CERT_SHA256}" ]]; then
            printf 'APK signing certificate SHA-256 mismatch\n' >&2
            exit 1
          fi
          TEST_CERT_SHA256="$("${APKSIGNER}" verify --print-certs "${TEST_APK_NAME}" \
            | sed -n 's/.*certificate SHA-256 digest: *//p' \
            | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]' \
            | grep -Eo '^[0-9a-f]{64}$' | head -n 1)"
          test "${TEST_CERT_SHA256}" = "${APK_CERT_SHA256}"

      - name: Generate and validate Android update manifest
        shell: bash
        run: |
          jq -n \
            --arg packageName com.daidai.daidai_app \
            --arg version "${VERSION}" \
            --argjson versionCode "${ANDROID_VERSION_CODE}" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/${RELEASE_TAG}/daidai-panel-native-${VERSION}-${RELEASE_CHANNEL}-arm64.apk" \
            --arg name "${APP_APK_NAME}" \
            --arg sha256 "$(sha256sum "${APP_APK_NAME}" | cut -d ' ' -f1)" \
            --argjson size "$(stat -c '%s' "${APP_APK_NAME}")" \
            '{schemaVersion: 1, packageName: $packageName, version: $version, versionCode: $versionCode, releaseNotes: "", full: {url: $url, name: $name, size: $size, sha256: $sha256}, patches: []}' \
            > android-update.json
          python3 scripts/version.py check --manifest android-update.json

      - name: Upload signed candidate APKs
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.candidate_artifact_name }}
          path: |
            ${{ env.APP_APK_NAME }}
            ${{ env.APP_APK_NAME }}.sha256
            ${{ env.TEST_APK_NAME }}
            ${{ env.TEST_APK_NAME }}.sha256
            android-update.json
            runtime/manifest.json
            runtime/smoke-evidence.json
            runtime/compatibility.json
            contracts/backend-api-mobile.json
            release/apk-metadata/**
          if-no-files-found: error
          retention-days: 14

  stable-device:
    if: needs.verify-build.outputs.release_channel == 'stable'
    needs: verify-build
    runs-on: [self-hosted, android-device]
    timeout-minutes: 90
    outputs:
      evidence_artifact_name: ${{ needs.verify-build.outputs.stable_device_evidence_artifact_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify-build.outputs.candidate_artifact_name }}
          path: candidate
      - name: Run stable candidate on trusted physical device
        env:
          APP_APK: candidate/${{ needs.verify-build.outputs.app_apk_name }}
          TEST_APK: candidate/${{ needs.verify-build.outputs.test_apk_name }}
        shell: bash
        run: |
          MATRIX_ID="$(jq -er '.device_smoke.matrix[0].id' scripts/release-runtime-contract.json)"
          mkdir -p evidence
          python3 scripts/android-runtime-smoke.py run \
            --apk "${APP_APK}" \
            --test-apk "${TEST_APK}" \
            --matrix-id "${MATRIX_ID}" \
            --expected-api "$(jq -er '.device_smoke.matrix[0].api' scripts/release-runtime-contract.json)" \
            --expected-page-size "$(jq -er '.device_smoke.matrix[0].page_size_bytes' scripts/release-runtime-contract.json)" \
            --expected-abi "$(jq -er '.device_smoke.matrix[0].abi' scripts/release-runtime-contract.json)" \
            --output "evidence/${MATRIX_ID}.json"
          python3 scripts/verify-release-runtime-evidence.py \
            --contract scripts/release-runtime-contract.json \
            --channel stable \
            --evidence-dir evidence \
            --app-apk "${APP_APK}" \
            --test-apk "${TEST_APK}"
          go run ./scripts/verify-runtime-contract.go \
            --manifest candidate/runtime/manifest.json \
            --compatibility candidate/runtime/compatibility.json \
            --smoke-evidence "evidence/${MATRIX_ID}.json" \
            --apk "${APP_APK}" \
            --strict \
            --strict-runtime-ids="$(jq -er '.stable_required_runtime_ids | join(",")' scripts/release-runtime-contract.json)"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ needs.verify-build.outputs.stable_device_evidence_artifact_name }}
          path: evidence/**
          if-no-files-found: error
          retention-days: 90

  release:
    if: always() && needs.verify-build.result == 'success' && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_channel == 'prerelease'))
    needs: [verify-build, stable-device]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout for release notes
        uses: actions/checkout@v5

      - name: Set up Go for evidence generation
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false

      - name: Require channel-appropriate device result
        env:
          CHANNEL: ${{ needs.verify-build.outputs.release_channel }}
          DEVICE_RESULT: ${{ needs.stable-device.result }}
        shell: bash
        run: |
          if [[ "${CHANNEL}" == "stable" ]]; then
            test "${DEVICE_RESULT}" = success
          else
            test "${CHANNEL}" = prerelease
            test "${DEVICE_RESULT}" = skipped
          fi

      - name: Download signed candidate artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify-build.outputs.candidate_artifact_name }}
          path: candidate

      - name: Download stable device evidence
        if: needs.verify-build.outputs.release_channel == 'stable'
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.stable-device.outputs.evidence_artifact_name }}
          path: device-evidence

      - name: Verify tested APK is the release candidate
        if: needs.verify-build.outputs.release_channel == 'stable'
        env:
          APP_APK: candidate/${{ needs.verify-build.outputs.app_apk_name }}
          TEST_APK: candidate/${{ needs.verify-build.outputs.test_apk_name }}
        shell: bash
        run: |
          python3 scripts/verify-release-runtime-evidence.py \
            --contract scripts/release-runtime-contract.json \
            --channel stable \
            --evidence-dir device-evidence \
            --app-apk "${APP_APK}" \
            --test-apk "${TEST_APK}"
          MATRIX_ID="$(jq -er '.device_smoke.matrix[0].id' scripts/release-runtime-contract.json)"
          EVIDENCE_FILE="$(find device-evidence -type f -name "${MATRIX_ID}.json" -print -quit)"
          test -n "${EVIDENCE_FILE}"
          cp "${EVIDENCE_FILE}" candidate/runtime/smoke-evidence.json
          mkdir -p release/device-smoke
          cp -R device-evidence/. release/device-smoke/

      - name: Generate final release evidence
        env:
          VERSION: ${{ needs.verify-build.outputs.version }}
          CHANNEL: ${{ needs.verify-build.outputs.release_channel }}
          APP_APK: candidate/${{ needs.verify-build.outputs.app_apk_name }}
          TEST_APK: candidate/${{ needs.verify-build.outputs.test_apk_name }}
        shell: bash
        run: |
          go run ./scripts/generate-release-evidence.go \
            --apk "${APP_APK}" \
            --test-apk "${TEST_APK}" \
            --version "${VERSION}" \
            --channel "${CHANNEL}" \
            --runtime-manifest candidate/runtime/manifest.json \
            --runtime-smoke candidate/runtime/smoke-evidence.json \
            --compatibility candidate/runtime/compatibility.json \
            --route-trace candidate/contracts/backend-api-mobile.json \
            --output-dir release/evidence \
            --git-commit "${GITHUB_SHA}" \
            --actor "${GITHUB_ACTOR}" \
            --repository "${GITHUB_REPOSITORY}"

      - name: Verify final release evidence gates
        env:
          CHANNEL: ${{ needs.verify-build.outputs.release_channel }}
        shell: bash
        run: |
          EVIDENCE=release/evidence/release-evidence.json
          test "$(jq -er '.bundle_status' "${EVIDENCE}")" = generated
          APK_SHA="$(sha256sum "candidate/${{ needs.verify-build.outputs.app_apk_name }}" | cut -d ' ' -f1)"
          test "$(jq -er --arg name '${{ needs.verify-build.outputs.app_apk_name }}' '.artifacts[] | select(.name == $name) | .sha256' "${EVIDENCE}")" = "${APK_SHA}"
          if [[ "${CHANNEL}" == "stable" ]]; then
            test "$(jq -er '.release.channel' "${EVIDENCE}")" = stable
            test "$(jq -er '.status' "${EVIDENCE}")" = completed
            test "$(jq -er '.status_scope' "${EVIDENCE}")" = required-gates-only
            jq -e '.required_gates == ["task_6_3_release_evidence", "task_6_4_device_stability_gate"]' "${EVIDENCE}"
            jq -e '.optional_gates == ["long_running_device_samples"]' "${EVIDENCE}"
            jq -e '.pending_evidence.long_running_device_samples.status == "pending"' "${EVIDENCE}"
            jq -e '.gates.task_6_3_release_evidence.status == "pass" and .gates.task_6_4_device_stability_gate.status == "pass"' "${EVIDENCE}"
          else
            test "$(jq -er '.release.channel' "${EVIDENCE}")" = prerelease
            test "$(jq -er '.status' "${EVIDENCE}")" = pending
            jq -e '.gates.task_6_3_release_evidence.status == "pending" and .gates.task_6_4_device_stability_gate.status == "pending"' "${EVIDENCE}"
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.verify-build.outputs.version }}"
          CHANNEL="${{ needs.verify-build.outputs.release_channel }}"
          RELEASE_TAG="${{ needs.verify-build.outputs.release_tag }}"
          python3 - "$VERSION" "$CHANNEL" > release-notes.md <<'PYEOF'
          import re, sys
          version, channel = sys.argv[1:]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          pattern = re.compile(r'^## v' + re.escape(version) + r'.*?(?=^## v|\Z)', re.MULTILINE | re.DOTALL)
          match = pattern.search(text)
          body = match.group(0).strip() if match else f'# 呆呆面板本机版 v{version}'
          print(body)
          print()
          if channel == 'stable':
              print('Stable Release 已通过正式签名、真机运行时验证与发布 APK 摘要一致性门禁。')
              print('附件证据记录了真机实际安装的 app APK 与 androidTest APK SHA256。')
          else:
              print('Prerelease 已通过版本、正式签名、证书指纹与 CI 构建门禁。')
              print('ARM64 Android 真机验证仍为 blocked 边界，release evidence 与 runtime gates 保持 pending。')
          PYEOF
          APP_APK="candidate/${{ needs.verify-build.outputs.app_apk_name }}"
          test -s "${APP_APK}"
          EXPECTED_APK_SHA="$(cut -d ' ' -f1 "${APP_APK}.sha256")"
          test "$(sha256sum "${APP_APK}" | cut -d ' ' -f1)" = "${EXPECTED_APK_SHA}"
          TEST_APK="candidate/${{ needs.verify-build.outputs.test_apk_name }}"
          mkdir -p release/artifacts release/apk-metadata
          cp "${APP_APK}" "${APP_APK}.sha256" "${TEST_APK}" "${TEST_APK}.sha256" release/artifacts/
          cp -R candidate/release/apk-metadata/. release/apk-metadata/
          tar -czf "release-evidence-${VERSION}.tar.gz" release

          RELEASE_LOOKUP="$(mktemp)"
          RELEASE_LOOKUP_ERROR="$(mktemp)"
          set +e
          gh api "/repos/${GITHUB_REPOSITORY}/releases/tags/${RELEASE_TAG}" > "${RELEASE_LOOKUP}" 2> "${RELEASE_LOOKUP_ERROR}"
          LOOKUP_STATUS=$?
          set -e

          if [[ "${CHANNEL}" == "stable" ]]; then
            if [[ "${LOOKUP_STATUS}" -eq 0 ]]; then
              printf 'Refusing to overwrite existing stable GitHub Release for tag %s\n' "${RELEASE_TAG}" >&2
              exit 1
            fi
            if ! grep -Eq 'HTTP 404' "${RELEASE_LOOKUP_ERROR}"; then
              printf 'Could not prove stable GitHub Release tag %s is unused; failing closed\n' "${RELEASE_TAG}" >&2
              exit 1
            fi
            TAG_COMMIT="$(git rev-list -n 1 "${RELEASE_TAG}" 2>/dev/null || true)"
            if [[ "${TAG_COMMIT}" != "${GITHUB_SHA}" ]]; then
              printf 'Stable tag %s resolves to %s, expected workflow commit %s\n' "${RELEASE_TAG}" "${TAG_COMMIT:-<missing>}" "${GITHUB_SHA}" >&2
              exit 1
            fi
            gh release create "${RELEASE_TAG}" \
              "${APP_APK}" \
              "${APP_APK}.sha256" \
              "${TEST_APK}" \
              "${TEST_APK}.sha256" \
              candidate/android-update.json \
              "release-evidence-${VERSION}.tar.gz" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "呆呆面板本机版 ${RELEASE_TAG}" \
              --notes-file release-notes.md \
              --verify-tag
            exit 0
          fi

          test "${CHANNEL}" = prerelease
          if [[ "${LOOKUP_STATUS}" -eq 0 ]]; then
            EXISTING_TAG="$(jq -er '.tag_name' "${RELEASE_LOOKUP}")"
            EXISTING_PRERELEASE="$(jq -er '.prerelease' "${RELEASE_LOOKUP}")"
            EXISTING_TARGET="$(jq -er '.target_commitish' "${RELEASE_LOOKUP}")"
            if [[ "${EXISTING_TAG}" != "${RELEASE_TAG}" || "${EXISTING_PRERELEASE}" != "true" ]]; then
              printf 'Refusing to update release: expected prerelease tag %s, got tag %s prerelease=%s\n' \
                "${RELEASE_TAG}" "${EXISTING_TAG}" "${EXISTING_PRERELEASE}" >&2
              exit 1
            fi
            TAG_LOOKUP="$(mktemp)"
            gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > "${TAG_LOOKUP}"
            TAG_TYPE="$(jq -er '.object.type' "${TAG_LOOKUP}")"
            TAG_COMMIT="$(jq -er '.object.sha' "${TAG_LOOKUP}")"
            if [[ "${TAG_TYPE}" != "commit" ]]; then
              printf 'Refusing to move prerelease tag %s: tag ref does not point directly to a commit\n' "${RELEASE_TAG}" >&2
              exit 1
            fi
            if [[ "${EXISTING_TARGET}" != "main" && "${EXISTING_TARGET}" != "${TAG_COMMIT}" ]]; then
              printf 'Refusing to move prerelease tag %s: release target %s is neither main nor old tag commit %s\n' \
                "${RELEASE_TAG}" "${EXISTING_TARGET}" "${TAG_COMMIT}" >&2
              exit 1
            fi

            UPDATED_TAG="$(mktemp)"
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/git/refs/tags/${RELEASE_TAG}" \
              -f sha="${GITHUB_SHA}" -F force=true > "${UPDATED_TAG}"
            test "$(jq -er '.object.type' "${UPDATED_TAG}")" = commit
            test "$(jq -er '.object.sha' "${UPDATED_TAG}")" = "${GITHUB_SHA}"
            gh release edit "${RELEASE_TAG}" \
              --repo "${GITHUB_REPOSITORY}" \
              --prerelease \
              --target "${GITHUB_SHA}" \
              --title "呆呆面板本机版 ${RELEASE_TAG}" \
              --notes-file release-notes.md
            gh release upload "${RELEASE_TAG}" \
              "${APP_APK}" \
              "${APP_APK}.sha256" \
              "${TEST_APK}" \
              "${TEST_APK}.sha256" \
              candidate/android-update.json \
              "release-evidence-${VERSION}.tar.gz" \
              --repo "${GITHUB_REPOSITORY}" \
              --clobber
            exit 0
          fi

          if ! grep -Eq 'HTTP 404' "${RELEASE_LOOKUP_ERROR}"; then
            printf 'Could not determine prerelease state for tag %s; failing closed\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          TAG_LOOKUP_ERROR="$(mktemp)"
          set +e
          gh api "/repos/${GITHUB_REPOSITORY}/git/ref/tags/${RELEASE_TAG}" > /dev/null 2> "${TAG_LOOKUP_ERROR}"
          TAG_LOOKUP_STATUS=$?
          set -e
          if [[ "${TAG_LOOKUP_STATUS}" -eq 0 ]]; then
            printf 'Refusing to create prerelease: tag %s already exists without a matching release\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          if ! grep -Eq 'HTTP 404' "${TAG_LOOKUP_ERROR}"; then
            printf 'Could not prove prerelease tag %s is unused; failing closed\n' "${RELEASE_TAG}" >&2
            exit 1
          fi
          gh release create "${RELEASE_TAG}" \
            "${APP_APK}" \
            "${APP_APK}.sha256" \
            "${TEST_APK}" \
            "${TEST_APK}.sha256" \
            candidate/android-update.json \
            "release-evidence-${VERSION}.tar.gz" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "呆呆面板本机版 ${RELEASE_TAG}" \
            --notes-file release-notes.md \
            --prerelease \
            --target "${GITHUB_SHA}"
