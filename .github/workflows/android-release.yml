name: Android Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.41.5
  GO_VERSION: 1.25.0

jobs:
  verify-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: panel/server/go.sum

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Test embedded Go core
        working-directory: panel/server
        run: go test -race ./router ./mobilecore ./database

      - name: Verify generated route contract
        run: go run ./scripts/generate-route-contract.go -check

      - name: Build embedded Core AAR
        working-directory: app
        env:
          PANEL_SOURCE_DIR: ${{ github.workspace }}/panel
        run: bash scripts/build-mobile-core-aar.sh

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: app
        run: flutter test

      - name: Analyze Flutter source
        working-directory: app
        run: flutter analyze

      - name: Run Kotlin tests
        working-directory: app
        run: gradle -p android :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Kotlin test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: |
            app/build/app/reports/tests/testDebugUnitTest/
            app/build/app/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Build installable release APK
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64

      - name: Verify runtime ELF manifest and hashes
        run: |
          go run ./scripts/run-runtime-smoke.go --output ./runtime/smoke-evidence.json
          go run ./scripts/verify-runtime-elf.go \
            --manifest ./runtime/manifest.json \
            --smoke-evidence ./runtime/smoke-evidence.json \
            --native-lib-dir ./app/android/app/src/main/jniLibs/arm64-v8a

      - name: Verify APK
        run: |
          test -s app/build/app/outputs/flutter-apk/app-release.apk
          VERSION="${GITHUB_REF_NAME:-snapshot}"
          cp app/build/app/outputs/flutter-apk/app-release.apk "daidai-panel-native-${VERSION}-arm64.apk"
          sha256sum "daidai-panel-native-${VERSION}-arm64.apk" > "daidai-panel-native-${VERSION}-arm64.apk.sha256"

      - name: Generate release evidence bundle
        run: |
          VERSION="${GITHUB_REF_NAME:-snapshot}"
          go run ./scripts/generate-release-evidence.go \
            --apk "daidai-panel-native-${VERSION}-arm64.apk" \
            --version "${VERSION}" \
            --output-dir ./release/evidence \
            --git-commit "${GITHUB_SHA}" \
            --actor "${GITHUB_ACTOR}" \
            --repository "${GITHUB_REPOSITORY}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daidai-panel-native-0.0.1-arm64
          path: |
            daidai-panel-native-*-arm64.apk
            daidai-panel-native-*-arm64.apk.sha256
          if-no-files-found: error
          retention-days: 14

      - name: Upload release evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-evidence-${{ github.ref_name || 'snapshot' }}
          path: |
            release/evidence/**
            runtime/manifest.json
            runtime/smoke-evidence.json
            runtime/compatibility.json
            contracts/backend-api-mobile.json
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: daidai-panel-native-0.0.1-arm64

      - name: Download release evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: release-evidence-${{ github.ref_name }}
          path: release-evidence

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cat > release-notes.md <<'EOF'
          # 呆呆面板本机版 ${{ github.ref_name }}

          - Android ARM64 构建版。
          - App 内嵌 Go 面板 Core，使用动态回环端口。
          - 支持本地管理员初始化、认证和任务管理 API。
          - 使用安装级 token、严格 Host 与 Origin 校验。
          - 使用 Android `:panel` 专用进程隔离 Core 生命周期。
          - 包含 Milestone 1-4 的 Core 恢复、运行时安全基线、执行 Operation、日志 cursor、SecretStore、依赖/Git/订阅/集成改进。
          - 包含 Milestone 5-6 的调度恢复、资源保护、备份恢复与发布证据结构。

          当前版本为阶段性构建。仓库未配置正式签名 Secret 时，APK 使用开发签名构建。
          EOF
          VERSION="${GITHUB_REF_NAME}"
          tar -czf "release-evidence-${VERSION}.tar.gz" release-evidence
          gh release create "${VERSION}" \
            "daidai-panel-native-${VERSION}-arm64.apk" \
            "daidai-panel-native-${VERSION}-arm64.apk.sha256" \
            "release-evidence-${VERSION}.tar.gz" \
            --repo "${{ github.repository }}" \
            --title "呆呆面板本机版 ${VERSION}" \
            --notes-file release-notes.md
