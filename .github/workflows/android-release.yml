name: Android Build and Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_channel:
        description: Build channel
        required: true
        default: snapshot
        type: choice
        options:
          - snapshot
          - prerelease
          - stable

permissions:
  contents: read
  actions: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

env:
  FLUTTER_VERSION: 3.41.5
  GO_VERSION: 1.25.0

jobs:
  verify-build:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    outputs:
      artifact_name: ${{ steps.version.outputs.artifact_name }}
      evidence_name: ${{ steps.version.outputs.evidence_name }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: panel/server/go.sum

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve and validate release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_CHANNEL: ${{ inputs.release_channel }}
        shell: bash
        run: |
          python3 scripts/version.py check
          eval "$(python3 scripts/version.py show --format shell)"
          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "v${VERSION}" ]]; then
            printf 'Tag %s must equal v%s from VERSION.json\n' "${GITHUB_REF_NAME}" "${VERSION}" >&2
            exit 1
          fi
          CHANNEL=snapshot
          STRICT=false
          SIGNING_REQUIRED=false
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            IS_PRERELEASE="$(gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
              --jq '.prerelease // false' 2>/dev/null || printf 'false')"
            if [[ "${IS_PRERELEASE}" == "true" ]]; then
              CHANNEL=prerelease
            else
              CHANNEL=release
              STRICT=true
              SIGNING_REQUIRED=true
            fi
          elif [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            case "${REQUESTED_CHANNEL:-snapshot}" in
              snapshot)
                ;;
              prerelease)
                CHANNEL=prerelease
                SIGNING_REQUIRED=true
                ;;
              stable)
                CHANNEL=release
                SIGNING_REQUIRED=true
                ;;
              *)
                printf 'Unsupported release channel: %s\n' "${REQUESTED_CHANNEL}" >&2
                exit 1
                ;;
            esac
          fi
          ARTIFACT_NAME="daidai-panel-native-${VERSION}-${CHANNEL}-arm64"
          EVIDENCE_NAME="release-evidence-${VERSION}-${CHANNEL}"
          {
            printf 'VERSION=%s\n' "${VERSION}"
            printf 'ANDROID_VERSION_CODE=%s\n' "${ANDROID_VERSION_CODE}"
            printf 'FLUTTER_BUILD_NAME=%s\n' "${FLUTTER_BUILD_NAME}"
            printf 'FLUTTER_BUILD_NUMBER=%s\n' "${FLUTTER_BUILD_NUMBER}"
            printf 'RELEASE_CHANNEL=%s\n' "${CHANNEL}"
            printf 'STRICT_RUNTIME=%s\n' "${STRICT}"
            printf 'RELEASE_SIGNING_REQUIRED=%s\n' "${SIGNING_REQUIRED}"
            printf 'ARTIFACT_NAME=%s\n' "${ARTIFACT_NAME}"
            printf 'EVIDENCE_NAME=%s\n' "${EVIDENCE_NAME}"
          } >> "${GITHUB_ENV}"
          {
            printf 'version=%s\n' "${VERSION}"
            printf 'artifact_name=%s\n' "${ARTIFACT_NAME}"
            printf 'evidence_name=%s\n' "${EVIDENCE_NAME}"
            printf 'strict=%s\n' "${STRICT}"
            printf 'signing_required=%s\n' "${SIGNING_REQUIRED}"
          } >> "${GITHUB_OUTPUT}"

      - name: Validate required tag release secrets
        if: steps.version.outputs.signing_required == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_CERT_SHA256: ${{ secrets.KEYSTORE_CERT_SHA256 }}
        shell: bash
        run: |
          for required in KEYSTORE_BASE64 KEYSTORE_PASSWORD KEYSTORE_ALIAS KEYSTORE_KEY_PASSWORD KEYSTORE_CERT_SHA256; do
            if [[ -z "${!required:-}" ]]; then
              printf 'Missing required tag release secret: %s\n' "${required}" >&2
              exit 1
            fi
          done

      - name: Prepare release signing keystore
        if: steps.version.outputs.signing_required == 'true'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_ALIAS: ${{ secrets.KEYSTORE_ALIAS }}
          KEYSTORE_KEY_PASSWORD: ${{ secrets.KEYSTORE_KEY_PASSWORD }}
          KEYSTORE_CERT_SHA256: ${{ secrets.KEYSTORE_CERT_SHA256 }}
        shell: bash
        run: |
          KEYSTORE_FILE="$(mktemp "${RUNNER_TEMP}/daidai-release-keystore.XXXXXX.jks")"
          printf '%s' "${KEYSTORE_BASE64}" | base64 --decode > "${KEYSTORE_FILE}"
          keytool -list -keystore "${KEYSTORE_FILE}" -storepass "${KEYSTORE_PASSWORD}" -alias "${KEYSTORE_ALIAS}" >/dev/null
          ACTUAL_CERT_SHA256="$(keytool -exportcert \
            -keystore "${KEYSTORE_FILE}" \
            -storepass "${KEYSTORE_PASSWORD}" \
            -alias "${KEYSTORE_ALIAS}" | sha256sum | cut -d ' ' -f1)"
          EXPECTED_CERT_SHA256="$(printf '%s' "${KEYSTORE_CERT_SHA256}" | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ "${ACTUAL_CERT_SHA256}" != "${EXPECTED_CERT_SHA256}" ]]; then
            printf 'Release signing certificate SHA-256 mismatch\n' >&2
            exit 1
          fi
          {
            printf 'KEYSTORE_FILE=%s\n' "${KEYSTORE_FILE}"
            printf 'KEYSTORE_PASSWORD=%s\n' "${KEYSTORE_PASSWORD}"
            printf 'KEYSTORE_ALIAS=%s\n' "${KEYSTORE_ALIAS}"
            printf 'KEYSTORE_KEY_PASSWORD=%s\n' "${KEYSTORE_KEY_PASSWORD}"
            printf 'REQUIRE_RELEASE_SIGNING=true\n'
          } >> "${GITHUB_ENV}"

      - name: Require strict device workflow evidence for tag
        if: steps.version.outputs.strict == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          DEVICE_RUN_ID="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/android-device-smoke.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty')"
          if [[ -z "${DEVICE_RUN_ID}" ]]; then
            printf 'Tag release requires a successful android-device-smoke.yml run for commit %s\n' "${GITHUB_SHA}" >&2
            exit 1
          fi
          mkdir -p release/device-smoke
          gh run download "${DEVICE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'android-runtime-smoke-api*' \
            --dir release/device-smoke
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected = {"api28-4k", "api35-4k", "api35-16k"}
          passed = set()
          strict_evidence = None
          for path in Path("release/device-smoke").rglob("*.device.json"):
              evidence = json.loads(path.read_text(encoding="utf-8"))
              matrix_id = evidence.get("matrix_id")
              if matrix_id in expected and evidence.get("status") == "verified":
                  device = evidence.get("device", {})
                  runtime = evidence.get("runtime", {})
                  records = runtime.get("records", [])
                  if device and len(records) == 8 and all(item.get("status") == "pass" for item in records):
                      passed.add(matrix_id)
                      if matrix_id == "api35-16k":
                          strict_evidence = path.with_name(path.name.removesuffix(".device.json") + ".json")
          missing = expected - passed
          if missing:
              raise SystemExit(f"missing strict device pass evidence: {sorted(missing)}")
          if strict_evidence is None or not strict_evidence.is_file():
              raise SystemExit("missing api35-16k runtime contract evidence")
          Path("runtime/smoke-evidence.json").write_bytes(strict_evidence.read_bytes())
          PY

      - name: Import cloud device evidence for signed release
        if: steps.version.outputs.signing_required == 'true' && steps.version.outputs.strict != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          DEVICE_RUN_ID="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/workflows/android-device-smoke.yml/runs?head_sha=${GITHUB_SHA}&status=success&per_page=100" \
            --jq '[.workflow_runs[] | select(.conclusion == "success")][0].id // empty')"
          if [[ -z "${DEVICE_RUN_ID}" ]]; then
            printf 'Signed release requires a successful android-device-smoke.yml run for commit %s\n' "${GITHUB_SHA}" >&2
            exit 1
          fi
          mkdir -p release/device-smoke
          gh run download "${DEVICE_RUN_ID}" \
            --repo "${GITHUB_REPOSITORY}" \
            --pattern 'android-runtime-smoke-*' \
            --dir release/device-smoke
          python3 - <<'PY'
          import json
          from pathlib import Path

          expected_matrix = {"api28-4k", "api35-4k", "api35-16k"}
          candidates = list(Path("release/device-smoke").rglob("api28-4k.json"))
          if len(candidates) != 1:
              raise SystemExit("expected one ARM64 blocked evidence file")
          evidence = json.loads(candidates[0].read_text(encoding="utf-8"))
          if set(evidence.get("matrix", [])) != expected_matrix:
              raise SystemExit("ARM64 blocked evidence matrix is incomplete")
          records = evidence.get("records", [])
          if len(records) != 8 or any(record.get("status") != "blocked" for record in records):
              raise SystemExit("ARM64 blocked evidence must contain eight blocked runtime records")
          Path("runtime/smoke-evidence.json").write_bytes(candidates[0].read_bytes())
          PY

      - name: Prepare Android Python runtime
        working-directory: app
        run: bash scripts/prepare-android-python-runtime.sh

      - name: Prepare Android Node runtime
        working-directory: app
        run: echo "Android Node runtime is deprecated; Node.js is installed via apk/apt in the rootfs."

      - name: Prepare Android Linux runtime
        working-directory: app
        run: |
          bash scripts/prepare-android-alpine-rootfs.sh
          bash scripts/prepare-android-yaegi-runtime.sh

      - name: Test embedded Go core
        working-directory: panel/server
        run: go test ./...

      - name: Test release and runtime contract scripts
        run: |
          go test ./scripts/run-runtime-smoke.go ./scripts/run-runtime-smoke_test.go
          go test ./scripts/verify-runtime-contract.go ./scripts/verify-runtime-contract_test.go
          go test ./scripts/verify-runtime-elf.go ./scripts/verify-runtime-elf_test.go
          python3 -m unittest scripts/test_version.py scripts/test_android_runtime_smoke.py app/scripts/test_verify_android_linux_runtime.py

      - name: Verify generated route contract
        run: go run ./scripts/generate-route-contract.go -check

      - name: Resolve Flutter packages
        working-directory: app
        run: flutter pub get

      - name: Run Flutter tests
        working-directory: app
        run: flutter test

      - name: Analyze Flutter source
        working-directory: app
        run: flutter analyze

      - name: Run Kotlin tests
        working-directory: app
        run: gradle -p android :app:testDebugUnitTest --no-daemon --stacktrace

      - name: Upload Kotlin test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kotlin-test-reports
          path: |
            app/build/app/reports/tests/testDebugUnitTest/
            app/build/app/test-results/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Generate snapshot smoke evidence before APK build
        if: steps.version.outputs.strict != 'true'
        run: go run ./scripts/run-runtime-smoke.go --output ./runtime/smoke-evidence.json

      - name: Verify runtime contract before APK build
        shell: bash
        run: |
          STRICT_ARGS=()
          if [[ "${STRICT_RUNTIME}" == "true" ]]; then
            STRICT_ARGS+=(--strict)
          fi
          go run ./scripts/verify-runtime-contract.go \
            --manifest ./runtime/manifest.json \
            --compatibility ./runtime/compatibility.json \
            --smoke-evidence ./runtime/smoke-evidence.json \
            --native-lib-dir ./app/android/app/src/main/jniLibs/arm64-v8a \
            "${STRICT_ARGS[@]}"

      - name: Build installable release APK
        working-directory: app
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --build-name "${FLUTTER_BUILD_NAME}" --build-number "${FLUTTER_BUILD_NUMBER}"
          cp build/app/outputs/flutter-apk/app-release.apk "../daidai-panel-native-${VERSION}-${RELEASE_CHANNEL}-arm64.apk"

      - name: Extract and verify APK runtime metadata
        shell: bash
        run: |
          APK_SOURCE="daidai-panel-native-${VERSION}-${RELEASE_CHANNEL}-arm64.apk"
          test -s "${APK_SOURCE}"
          mkdir -p release/apk-metadata
          unzip -p "${APK_SOURCE}" assets/manifest.json > release/apk-metadata/manifest.json
          unzip -p "${APK_SOURCE}" assets/compatibility.json > release/apk-metadata/compatibility.json
          unzip -p "${APK_SOURCE}" assets/smoke-evidence.json > release/apk-metadata/smoke-evidence.json
          cmp runtime/manifest.json release/apk-metadata/manifest.json
          cmp runtime/compatibility.json release/apk-metadata/compatibility.json
          cmp runtime/smoke-evidence.json release/apk-metadata/smoke-evidence.json
          STRICT_ARGS=()
          if [[ "${STRICT_RUNTIME}" == "true" ]]; then
            STRICT_ARGS+=(--strict)
          fi
          go run ./scripts/verify-runtime-contract.go \
            --manifest ./runtime/manifest.json \
            --compatibility ./runtime/compatibility.json \
            --smoke-evidence ./runtime/smoke-evidence.json \
            --apk "${APK_SOURCE}" \
            "${STRICT_ARGS[@]}"
          for APK in daidai-panel-native-${VERSION}-${RELEASE_CHANNEL}-arm64.apk; do
            sha256sum "${APK}" > "${APK}.sha256"
          done

      - name: Verify release APK signing certificate
        if: steps.version.outputs.signing_required == 'true'
        shell: bash
        run: |
          APKSIGNER="$(find "${ANDROID_SDK_ROOT}/build-tools" -mindepth 2 -maxdepth 2 -type f -name apksigner -print | sort -V | tail -n 1)"
          if [[ -z "${APKSIGNER}" ]]; then
            printf 'Android SDK apksigner was not found\n' >&2
            exit 1
          fi
          for APK in daidai-panel-native-${VERSION}-${RELEASE_CHANNEL}-arm64.apk; do "${APKSIGNER}" verify "${APK}"; done
          APK_CERT_SHA256="$("${APKSIGNER}" verify --print-certs "daidai-panel-native-${VERSION}-${RELEASE_CHANNEL}-arm64.apk" \
            | sed -n 's/.*certificate SHA-256 digest: *//p' \
            | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]' \
            | grep -Eo '^[0-9a-f]{64}$' | head -n 1)"
          if [[ -z "${APK_CERT_SHA256}" ]]; then
            printf 'APK signing certificate SHA-256 could not be parsed\n' >&2
            exit 1
          fi
          EXPECTED_CERT_SHA256="$(printf '%s' '${{ secrets.KEYSTORE_CERT_SHA256 }}' | tr -d ':[:space:]' | tr '[:upper:]' '[:lower:]')"
          if [[ "${APK_CERT_SHA256}" != "${EXPECTED_CERT_SHA256}" ]]; then
            printf 'APK signing certificate SHA-256 mismatch\n' >&2
            exit 1
          fi

      - name: Generate and validate Android update manifest
        shell: bash
        run: |
          jq -n \
            --arg packageName com.daidai.daidai_app \
            --arg version "${VERSION}" \
            --argjson versionCode "${ANDROID_VERSION_CODE}" \
            --arg url "https://github.com/${GITHUB_REPOSITORY}/releases/download/v${VERSION}/daidai-panel-native-${VERSION}-${RELEASE_CHANNEL}-arm64.apk" \
            --arg name "daidai-panel-native-${VERSION}-${RELEASE_CHANNEL}-arm64.apk" \
            --arg sha256 "$(sha256sum "daidai-panel-native-${VERSION}-${RELEASE_CHANNEL}-arm64.apk" | cut -d ' ' -f1)" \
            --argjson size "$(stat -c '%s' "daidai-panel-native-${VERSION}-${RELEASE_CHANNEL}-arm64.apk")" \
            '{schemaVersion: 1, packageName: $packageName, version: $version, versionCode: $versionCode, releaseNotes: "", full: {url: $url, name: $name, size: $size, sha256: $sha256}, patches: []}' \
            > android-update.json
          python3 scripts/version.py check --manifest android-update.json

      - name: Generate release evidence bundle
        run: |
          go run ./scripts/generate-release-evidence.go \
            --apk "daidai-panel-native-${VERSION}-${RELEASE_CHANNEL}-arm64.apk" \
            --version "${VERSION}" \
            --output-dir ./release/evidence \
            --git-commit "${GITHUB_SHA}" \
            --actor "${GITHUB_ACTOR}" \
            --repository "${GITHUB_REPOSITORY}"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.artifact_name }}
          path: |
            daidai-panel-native-${{ steps.version.outputs.version }}-${{ env.RELEASE_CHANNEL }}-*.apk
            daidai-panel-native-${{ steps.version.outputs.version }}-${{ env.RELEASE_CHANNEL }}-*.apk.sha256
            android-update.json
          if-no-files-found: error
          retention-days: 14

      - name: Upload release evidence artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.version.outputs.evidence_name }}
          path: |
            release/evidence/**
            release/apk-metadata/**
            release/device-smoke/**
            runtime/manifest.json
            runtime/smoke-evidence.json
            runtime/compatibility.json
            contracts/backend-api-mobile.json
          if-no-files-found: error
          retention-days: 30

  release:
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && (inputs.release_channel == 'stable' || inputs.release_channel == 'prerelease'))
    needs: verify-build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout for release notes
        uses: actions/checkout@v5

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          pattern: 'daidai-panel-native-${{ needs.verify-build.outputs.version }}-*'
          merge-multiple: true

      - name: Download release evidence artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ needs.verify-build.outputs.evidence_name }}
          path: release-evidence

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${{ needs.verify-build.outputs.version }}"
          python3 - "$VERSION" > release-notes.md <<'PYEOF'
          import re, sys
          version = sys.argv[1]
          text = open('CHANGELOG.md', encoding='utf-8').read()
          pattern = re.compile(r'^## v' + re.escape(version) + r'.*?(?=^## v|\Z)', re.MULTILINE | re.DOTALL)
          match = pattern.search(text)
          body = match.group(0).strip() if match else f'# 呆呆面板本机版 v{version}'
          print(body)
          print()
          print('本 Release 已通过版本、正式签名、证书指纹、运行时契约与 CI 构建门禁。')
          print('GitHub 云 runner 不支持 ARM64 Android 模拟器，附件证据将对应 ARM64 设备矩阵记录为 blocked，等待真机补充验证。')
          PYEOF
          CHANNEL="${{ inputs.release_channel == 'prerelease' && 'prerelease' || 'release' }}"
          APK_PATH="$(find . -maxdepth 1 -type f -name "*-${VERSION}-${CHANNEL}-arm64.apk" -print -quit)"
          if [[ -z "${APK_PATH}" ]]; then
            printf 'Signed release APK was not downloaded\n' >&2
            exit 1
          fi
          ARTIFACT_NAME="${APK_PATH#./}"
          ARTIFACT_NAME="${ARTIFACT_NAME%.apk}"
          tar -czf "release-evidence-${VERSION}.tar.gz" release-evidence
          RELEASE_ARGS=()
          if [[ "${CHANNEL}" == "prerelease" ]]; then RELEASE_ARGS+=(--prerelease); fi
          gh release create "v${VERSION}" \
            daidai-panel-native-${VERSION}-${CHANNEL}-*.apk \
            daidai-panel-native-${VERSION}-${CHANNEL}-*.apk.sha256 \
            android-update.json \
            "release-evidence-${VERSION}.tar.gz" \
            --repo "${{ github.repository }}" \
            --title "呆呆面板本机版 v${VERSION}" \
            --notes-file release-notes.md \
            "${RELEASE_ARGS[@]}"
