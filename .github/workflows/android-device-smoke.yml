name: Android Device Runtime Smoke

on:
  workflow_dispatch:
    inputs:
      external_evidence_json:
        description: Unverified physical-device evidence JSON; imported records remain blocked
        required: false
        type: string
      external_matrix_id:
        description: Label recorded for unverified external evidence
        required: false
        default: physical-device
        type: string
      run_physical_device:
        description: Run on a connected ARM64 device hosted by a self-hosted Android runner
        required: false
        default: false
        type: boolean
      physical_device_serial:
        description: Optional adb serial on the self-hosted Android runner
        required: false
        type: string
      physical_expected_api:
        description: Expected API level for the connected physical device
        required: false
        default: '35'
        type: string
      physical_expected_page_size:
        description: Expected page size in bytes for the connected physical device
        required: false
        default: '16384'
        type: choice
        options:
          - '4096'
          - '16384'
      physical_expected_abi:
        description: Expected ABI for the connected physical device
        required: false
        default: 'arm64-v8a'
        type: choice
        options:
          - 'arm64-v8a'
  pull_request:
    paths:
      - 'app/android/**'
      - 'app/scripts/prepare-android-*-runtime.sh'
      - 'app/scripts/prepare-android-alpine-rootfs.sh'
      - 'app/scripts/verify-android-linux-runtime.py'
      - 'app/scripts/test_verify_android_linux_runtime.py'
      - 'panel/server/**'
      - 'runtime/**'
      - 'scripts/android-runtime-smoke.py'
      - '.github/workflows/android-device-smoke.yml'
  push:
    branches:
      - main

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.41.5
  GO_VERSION: 1.25.0

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: panel/server/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Prepare embedded runtimes and Go Core
        working-directory: app
        env:
          PANEL_SOURCE_DIR: ${{ github.workspace }}/panel
        run: |
          bash scripts/prepare-android-python-runtime.sh
          bash scripts/prepare-android-alpine-rootfs.sh
          bash scripts/prepare-android-yaegi-runtime.sh
          flutter pub get
      - name: Build debug application and instrumentation APKs
        working-directory: app
        run: flutter build apk --debug --target-platform android-arm64 && gradle -p android :app:assembleDebugAndroidTest --no-daemon --stacktrace
      - name: Verify smoke driver dry-run
        run: |
          python3 scripts/android-runtime-smoke.py dry-run \
            --apk app/build/app/outputs/flutter-apk/app-debug.apk \
            --test-apk app/build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk \
            --matrix-id api35-4k --expected-api 35 --expected-page-size 4096
      - name: Test smoke driver
        run: python3 -m unittest scripts/test_android_runtime_smoke.py app/scripts/test_verify_android_linux_runtime.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-runtime-smoke-apks
          path: |
            app/build/app/outputs/flutter-apk/app-debug.apk
            app/build/app/outputs/apk/androidTest/debug/app-debug-androidTest.apk
          if-no-files-found: error
          retention-days: 7

  physical-device:
    if: github.event_name == 'workflow_dispatch' && inputs.run_physical_device
    needs: build
    runs-on: [self-hosted, android-device]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: android-runtime-smoke-apks
          path: smoke-apks
      - name: Run trusted physical-device smoke
        env:
          ANDROID_SERIAL: ${{ inputs.physical_device_serial }}
        run: |
          MATRIX_ID="physical-${{ inputs.physical_expected_abi }}-api${{ inputs.physical_expected_api }}-${{ inputs.physical_expected_page_size }}"
          python3 scripts/android-runtime-smoke.py run \
            --apk smoke-apks/flutter-apk/app-debug.apk \
            --test-apk smoke-apks/apk/androidTest/debug/app-debug-androidTest.apk \
            --matrix-id "${MATRIX_ID}" \
            --expected-api "${{ inputs.physical_expected_api }}" \
            --expected-page-size "${{ inputs.physical_expected_page_size }}" \
            --expected-abi "${{ inputs.physical_expected_abi }}" \
            --output "evidence/${MATRIX_ID}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: android-runtime-smoke-physical-${{ inputs.physical_expected_abi }}-verified
          path: evidence/**
          if-no-files-found: error
          retention-days: 90

  arm64-emulator-blocked:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Record ARM64 emulator blocked evidence
        run: |
          mkdir -p evidence
          for matrix_id in api28-4k api35-4k; do
            python3 scripts/android-runtime-smoke.py blocked \
              --matrix-id "$matrix_id" \
              --reason "ARM64 Android emulator unsupported on GitHub cloud runners; see reactivecircus/android-emulator-runner#350" \
              --output "evidence/${matrix_id}.json"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: android-runtime-smoke-arm64-blocked
          path: evidence/api28-4k.json
          retention-days: 30
