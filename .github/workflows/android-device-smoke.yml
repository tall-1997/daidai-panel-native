name: Android Device Runtime Smoke

on:
  workflow_dispatch:
    inputs:
      external_evidence_json:
        description: Unverified physical-device evidence JSON; imported records remain blocked
        required: false
        type: string
      external_matrix_id:
        description: Label recorded for unverified external evidence
        required: false
        default: physical-device
        type: string
      run_physical_device:
        description: Run on a connected ARM64 device hosted by a self-hosted Android runner
        required: false
        default: false
        type: boolean
      physical_device_serial:
        description: Optional adb serial on the self-hosted Android runner
        required: false
        type: string
  pull_request:
    paths:
      - 'app/android/**'
      - 'app/scripts/prepare-android-*-runtime.sh'
      - 'app/scripts/prepare-android-ubuntu-rootfs.sh'
      - 'app/scripts/prepare-android-alpine-rootfs.sh'
      - 'app/scripts/prepare-android-native-source-build.sh'
      - 'app/android/app/src/main/jni/**'
      - 'app/scripts/verify-android-linux-runtime.py'
      - 'app/scripts/test_verify_android_linux_runtime.py'
      - 'app/scripts/test_prepare_android_ubuntu_rootfs.py'
      - 'app/scripts/test_prepare_android_alpine_rootfs.py'
      - 'app/scripts/rootfs-trusted-sources.json'
      - 'panel/server/**'
      - 'panel/web/**'
      - 'runtime/**'
      - 'scripts/android-runtime-smoke.py'
      - 'scripts/test_android_runtime_smoke.py'
      - 'scripts/release-runtime-contract.json'
      - 'scripts/verify-release-runtime-evidence.py'
      - 'scripts/test_verify_release_runtime_evidence.py'
      - '.github/workflows/android-device-smoke.yml'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/android-device-smoke.yml'
      - 'app/android/**'
      - 'app/scripts/**android*runtime*'
      - 'app/runtime-tools/yaegi/**'
      - 'panel/server/**'
      - 'panel/web/**'
      - 'runtime/**'
      - 'scripts/android-runtime-smoke.py'
      - 'scripts/test_android_runtime_smoke.py'
      - 'scripts/release-runtime-contract.json'
      - 'scripts/verify-release-runtime-evidence.py'
      - 'scripts/test_verify_release_runtime_evidence.py'

permissions:
  contents: read

env:
  FLUTTER_VERSION: 3.41.5
  GO_VERSION: 1.25.0
  NODE_VERSION: '20.19.x'
  NPM_VERSION: '10.8.2'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: panel/server/go.sum
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: panel/web/package-lock.json
      - name: Enforce Node package manager contract
        run: |
          npm install -g "npm@${NPM_VERSION}"
          node --version | grep -Eq '^v20\.19\.'
          test "$(npm --version)" = "${NPM_VERSION}"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Load release runtime contract
        shell: bash
        run: |
          MATRIX_COUNT="$(jq -er '.device_smoke.matrix | length' scripts/release-runtime-contract.json)"
          test "${MATRIX_COUNT}" = "1"
          {
            printf 'DEVICE_MATRIX_ID=%s\n' "$(jq -er '.device_smoke.matrix[0].id' scripts/release-runtime-contract.json)"
            printf 'DEVICE_EXPECTED_API=%s\n' "$(jq -er '.device_smoke.matrix[0].api' scripts/release-runtime-contract.json)"
            printf 'DEVICE_EXPECTED_PAGE_SIZE=%s\n' "$(jq -er '.device_smoke.matrix[0].page_size_bytes' scripts/release-runtime-contract.json)"
            printf 'DEVICE_EXPECTED_ABI=%s\n' "$(jq -er '.device_smoke.matrix[0].abi' scripts/release-runtime-contract.json)"
            printf 'DEVICE_VERIFIED_ARTIFACT=%s\n' "$(jq -er '.device_smoke.verified_artifact' scripts/release-runtime-contract.json)"
            printf 'DEVICE_BLOCKED_ARTIFACT=%s\n' "$(jq -er '.device_smoke.blocked_artifact' scripts/release-runtime-contract.json)"
          } >> "${GITHUB_ENV}"
      - name: Prepare embedded runtimes and Go Core
        working-directory: app
        env:
          PANEL_SOURCE_DIR: ${{ github.workspace }}/panel
        run: |
          python3 scripts/verify-android-linux-runtime.py \
            --rootfs android/app/src/main/assets/android-runtime/arm64-v8a/ubuntu/rootfs.tar.gz.bin \
            --rootfs-sha android/app/src/main/assets/android-runtime/arm64-v8a/ubuntu/rootfs.tar.gz.bin.sha256 \
            --rootfs-manifest android/app/src/main/assets/android-runtime/arm64-v8a/ubuntu/runtime-manifest.json \
            --trusted-sources scripts/rootfs-trusted-sources.json
          bash scripts/prepare-android-yaegi-runtime.sh
          flutter pub get
      - name: Build release application and instrumentation APKs
        working-directory: app
        run: flutter build apk --release --target-platform android-arm64 && gradle -p android :app:assembleReleaseAndroidTest --no-daemon --stacktrace
      - name: Verify smoke driver dry-run
        run: |
          python3 scripts/android-runtime-smoke.py dry-run \
            --apk app/build/app/outputs/flutter-apk/app-release.apk \
            --test-apk app/build/app/outputs/apk/androidTest/release/app-release-androidTest.apk \
            --matrix-id "${DEVICE_MATRIX_ID}" \
            --expected-api "${DEVICE_EXPECTED_API}" \
            --expected-page-size "${DEVICE_EXPECTED_PAGE_SIZE}" \
            --expected-abi "${DEVICE_EXPECTED_ABI}"
      - name: Test smoke driver
        run: python3 -m unittest scripts/test_android_runtime_smoke.py scripts/test_verify_release_runtime_evidence.py app/scripts/test_verify_android_linux_runtime.py app/scripts/test_prepare_android_ubuntu_rootfs.py app/scripts/test_prepare_android_alpine_rootfs.py
      - uses: actions/upload-artifact@v4
        with:
          name: android-runtime-smoke-apks
          path: |
            app/build/app/outputs/flutter-apk/app-release.apk
            app/build/app/outputs/apk/androidTest/release/app-release-androidTest.apk
          if-no-files-found: error
          retention-days: 7

  physical-device:
    if: github.event_name == 'workflow_dispatch' && inputs.run_physical_device
    needs: build
    runs-on: [self-hosted, android-device]
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Load release runtime contract
        shell: bash
        run: |
          MATRIX_COUNT="$(jq -er '.device_smoke.matrix | length' scripts/release-runtime-contract.json)"
          test "${MATRIX_COUNT}" = "1"
          {
            printf 'DEVICE_MATRIX_ID=%s\n' "$(jq -er '.device_smoke.matrix[0].id' scripts/release-runtime-contract.json)"
            printf 'DEVICE_EXPECTED_API=%s\n' "$(jq -er '.device_smoke.matrix[0].api' scripts/release-runtime-contract.json)"
            printf 'DEVICE_EXPECTED_PAGE_SIZE=%s\n' "$(jq -er '.device_smoke.matrix[0].page_size_bytes' scripts/release-runtime-contract.json)"
            printf 'DEVICE_EXPECTED_ABI=%s\n' "$(jq -er '.device_smoke.matrix[0].abi' scripts/release-runtime-contract.json)"
            printf 'DEVICE_VERIFIED_ARTIFACT=%s\n' "$(jq -er '.device_smoke.verified_artifact' scripts/release-runtime-contract.json)"
          } >> "${GITHUB_ENV}"
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/download-artifact@v4
        with:
          name: android-runtime-smoke-apks
          path: smoke-apks
      - name: Run trusted physical-device smoke
        env:
          ANDROID_SERIAL: ${{ inputs.physical_device_serial }}
        run: |
          python3 scripts/android-runtime-smoke.py run \
            --apk smoke-apks/flutter-apk/app-release.apk \
            --test-apk smoke-apks/apk/androidTest/release/app-release-androidTest.apk \
            --matrix-id "${DEVICE_MATRIX_ID}" \
            --expected-api "${DEVICE_EXPECTED_API}" \
            --expected-page-size "${DEVICE_EXPECTED_PAGE_SIZE}" \
            --expected-abi "${DEVICE_EXPECTED_ABI}" \
            --output "evidence/${DEVICE_MATRIX_ID}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE_VERIFIED_ARTIFACT }}
          path: evidence/**
          if-no-files-found: error
          retention-days: 90

  arm64-emulator-blocked:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - name: Load release runtime contract
        shell: bash
        run: |
          MATRIX_COUNT="$(jq -er '.device_smoke.matrix | length' scripts/release-runtime-contract.json)"
          test "${MATRIX_COUNT}" = "1"
          {
            printf 'DEVICE_MATRIX_ID=%s\n' "$(jq -er '.device_smoke.matrix[0].id' scripts/release-runtime-contract.json)"
            printf 'DEVICE_BLOCKED_ARTIFACT=%s\n' "$(jq -er '.device_smoke.blocked_artifact' scripts/release-runtime-contract.json)"
          } >> "${GITHUB_ENV}"
      - name: Record ARM64 emulator blocked evidence
        run: |
          mkdir -p evidence
          python3 scripts/android-runtime-smoke.py blocked \
            --matrix-id "${DEVICE_MATRIX_ID}" \
            --reason "ARM64 Android emulator unsupported on GitHub cloud runners; see reactivecircus/android-emulator-runner#350" \
            --output "evidence/${DEVICE_MATRIX_ID}.json"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.DEVICE_BLOCKED_ARTIFACT }}
          path: evidence/${{ env.DEVICE_MATRIX_ID }}.json
          retention-days: 30

  x86-64-emulator:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: panel/web/package-lock.json
      - name: Enforce Node package manager contract
        run: |
          npm install -g "npm@${NPM_VERSION}"
          test "$(npm --version)" = "${NPM_VERSION}"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.1.0'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Build x86_64 release APKs
        working-directory: app
        run: |
          flutter pub get
          ANDROID_RUNTIME_ABIS=x86_64 FORCE_REBUILD_PROOT=1 bash scripts/prepare-android-native-source-build.sh
          # apt proot on ubuntu-24.04 is 5.1.0 (2015) and cannot translate statx,
          # which breaks Node 24/libuv stat probes inside the alpine rootfs.
          # Use the official static release (fully static, statx-capable) instead.
          sudo curl -fsSL --retry 3 --connect-timeout 30 -o /usr/local/bin/proot \
            https://github.com/proot-me/proot/releases/download/v5.3.0/proot-v5.3.0-x86_64-static
          echo "d1eb20cb201e6df08d707023efb000623ff7c10d6574839d7bb42d0adba6b4da  /usr/local/bin/proot" | sudo sha256sum -c -
          sudo chmod 0755 /usr/local/bin/proot
          ANDROID_RUNTIME_ABIS=x86_64 bash scripts/prepare-android-alpine-rootfs.sh
          ANDROID_RUNTIME_ABIS=x86_64 bash scripts/prepare-android-yaegi-runtime.sh
          ANDROID_RUNTIME_ABIS=x86_64 FLUTTER_SPLIT_PER_ABI=true flutter build apk --release --target-platform android-x64 --split-per-abi
          ANDROID_RUNTIME_ABIS=x86_64 gradle -p android :app:assembleReleaseAndroidTest --no-daemon --stacktrace
      - name: Run x86_64 runtime smoke
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -cores 2 -memory 2048
          disable-animations: true
          script: >-
            python3 scripts/android-runtime-smoke.py run
            --apk app/build/app/outputs/flutter-apk/app-x86_64-release.apk
            --test-apk app/build/app/outputs/apk/androidTest/release/app-release-androidTest.apk
            --matrix-id api30-x86_64-4k
            --expected-api 30
            --expected-page-size 4096
            --expected-abi x86_64
            --timeout 1200
            --output evidence/api30-x86_64-4k.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-runtime-smoke-api30-x86_64-4k
          path: evidence/api30-x86_64-4k*
          if-no-files-found: error
          retention-days: 30
