name: Setup embedded mobile core
description: Checkout and build the pinned Android gomobile core AAR

inputs:
  panel-ref:
    description: daidai-panel-native commit or ref
    required: false
    default: c1f5d227bbd6c10b0ddab98156bb46a3bae1dd43

runs:
  using: composite
  steps:
    - name: Checkout panel core source
      uses: actions/checkout@v5
      with:
        repository: tall-1997/daidai-panel-native
        ref: ${{ inputs.panel-ref }}
        path: panel-core

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: 1.25.0
        cache-dependency-path: panel-core/server/go.sum

    - name: Install pinned gomobile
      shell: bash
      run: |
        go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20260709172247-6129f5bee9d5
        "$(go env GOPATH)/bin/gomobile" init

    - name: Build mobile core AAR
      shell: bash
      env:
        PANEL_SOURCE_DIR: ${{ github.workspace }}/panel-core
        PANEL_REF: ${{ inputs.panel-ref }}
      run: bash scripts/build-mobile-core-aar.sh
