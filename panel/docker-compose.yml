name: daidai-panel

services:
  daidai-panel:
    image: linzixuanzz/daidai-panel:latest
    container_name: daidai-panel
    restart: unless-stopped
    ports:
      - "5700:5700" # 宿主机端口:容器内 Nginx 端口
    volumes:
      - ./Dumb-Panel:/app/Dumb-Panel
    environment:
      - TZ=Asia/Shanghai
      - CONTAINER_NAME=daidai-panel
      - IMAGE_NAME=linzixuanzz/daidai-panel:latest
      - PANEL_UPDATE_MANAGER=watchtower
      # === 飞牛 OS / 群晖 / 绿联等 NAS 可选环境变量 ===========================
      # 让容器以宿主机用户身份运行，使 SMB/NFS 共享的目录权限一致。
      # 不设则默认 root（与历史行为兼容）。运行 `id` 查看你的 UID/GID。
      # 两个都要设：只设 PGID 时 PUID 会取到 0，等于没降权。
      # 取值与镜像里已有的账号撞车不要紧（例如 Debian 版镜像自带 uid/gid 1000 的 node
      # 用户），容器会直接复用那个账号 —— 降权真正需要的只是 uid/gid 对上。
      # 注意：降权后面板里的「Linux 系统依赖」(apk/apt) 装不了，它需要 root；
      # Node.js / Python 依赖不受影响。
      # - PUID=1000
      # - PGID=1000
      #
      # 公网域名/反代域名访问面板时需要把 origin 加入 CORS 白名单。
      # 私有/局域网 IP 已自动放行，无需配置。多个用逗号分隔。
      # - CORS_ORIGINS=https://panel.your-domain.com,https://nas.your-domain.com
    labels:
      - com.centurylinklabs.watchtower.enable=true

  watchtower:
    # 必须使用 Watchtower v1.20.0（2026-07-21）或更新的版本。
    # 下面的 WATCHTOWER_HTTP_API_ENDPOINTS 是 v1.20.0 才引入的环境变量，更早的版本只认命令行
    # 参数 --http-api-update，并且遇到不认识的环境变量会静默忽略：容器照常启动、日志也不报错，
    # 但 HTTP API 的 8080 端口从头到尾不会打开，面板触发更新时只会拿到 connection refused。
    # 另外 watchtower 自己带了 com.centurylinklabs.watchtower.enable=false，不会自我更新，
    # 本地这份 latest 是哪天拉的就停在哪天的版本。老部署升级前请先手动拉一次：
    #   docker compose pull watchtower
    #   docker compose up -d watchtower
    # 想确认实际版本就看 watchtower 的启动日志，这份配置没有加 --no-startup-message，
    # 启动时会直接打印版本号：
    #   docker logs daidai-watchtower
    # 走国内镜像加速站时还要留意：加速站上的 latest 可能是很旧的缓存，必要时改拉具体版本
    # （例如 nickfedor/watchtower:1.21.2）或临时直连 Docker Hub 拉一次。
    image: nickfedor/watchtower:latest
    container_name: daidai-watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      - com.centurylinklabs.watchtower.enable=false
    command:
      - --label-enable
      - --cleanup
      - --interval
      - "3600"
